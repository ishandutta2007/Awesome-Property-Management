<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateY(400px); opacity: 0.3; }
      }
      .bg-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
      .bg-orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .float-card-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-card-2 { animation: floatFast 4s ease-in-out infinite 1s; }
      .grid-dash { stroke: #334155; stroke-dasharray: 6 6; animation: dashMove 15s linear infinite; }
    </style>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="400" rx="20" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- Dynamic Animated Orbs -->
  <circle class="bg-orb-1" cx="200" cy="100" r="180" fill="#38bdf8" />
  <circle class="bg-orb-2" cx="1000" cy="300" r="220" fill="#c084fc" />

  <!-- Grid Blueprint Lines -->
  <g class="grid-dash" stroke-width="1" opacity="0.4">
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
    <line x1="720" y1="0" x2="720" y2="400" />
    <line x1="920" y1="0" x2="920" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Right Side Architectural Silhouette -->
  <g opacity="0.3" stroke="url(#accent-grad)" stroke-width="2" fill="none">
    <rect x="820" y="140" width="90" height="260" rx="6" />
    <rect x="930" y="90" width="110" height="310" rx="6" />
    <rect x="1060" y="190" width="80" height="210" rx="6" />
    <!-- Building Windows -->
    <line x1="820" y1="200" x2="910" y2="200" />
    <line x1="820" y1="260" x2="910" y2="260" />
    <line x1="820" y1="320" x2="910" y2="320" />
    <line x1="930" y1="150" x2="1040" y2="150" />
    <line x1="930" y1="210" x2="1040" y2="210" />
    <line x1="930" y1="270" x2="1040" y2="270" />
    <line x1="930" y1="330" x2="1040" y2="330" />
  </g>

  <!-- Left Side Main Typography & Badges -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 70)">
      <rect width="250" height="34" rx="17" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5" />
      <circle cx="20" cy="17" r="6" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="22" fill="#38bdf8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">AWESOME PMS ECOSYSTEM</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="170" fill="url(#accent-grad)" font-family="'Segoe UI', system-ui, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Property Management</text>
    <text x="0" y="230" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">Software &amp; Open-Source</text>

    <!-- Subtitle -->
    <text x="0" y="280" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="400">
      Curated directory of SaaS platforms, market insights, pricing &amp; self-hosted tools
    </text>

    <!-- Interactive Metrics Tag Group -->
    <g transform="translate(0, 315)">
      <!-- Metric 1 -->
      <g>
        <rect width="155" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" />
        <circle cx="18" cy="18" r="5" fill="#38bdf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SaaS Benchmarks</text>
      </g>
      <!-- Metric 2 -->
      <g transform="translate(170, 0)">
        <rect width="170" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" />
        <circle cx="18" cy="18" r="5" fill="#818cf8" />
        <text x="32" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Open-Source Repos</text>
      </g>
      <!-- Metric 3 -->
      <g transform="translate(355, 0)">
        <rect width="155" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" />
        <circle cx="18" cy="18" r="5" fill="#c084fc" />
        <text x="32" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Market Dynamics</text>
      </g>
    </g>
  </g>

  <!-- Right Floating Dynamic UI Card 1 -->
  <g class="float-card-1" transform="translate(860, 70)">
    <rect width="240" height="110" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#38bdf8" opacity="0.2" />
    <text x="28" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18">🏢</text>
    <text x="64" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Top SaaS Platforms</text>
    <text x="64" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">AppFolio, Yardi, Entrata</text>
    <line x1="16" y1="70" x2="224" y2="70" stroke="#334155" stroke-width="1" />
    <text x="16" y="92" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Pricing &amp; Free Limits</text>
  </g>

  <!-- Right Floating Dynamic UI Card 2 -->
  <g class="float-card-2" transform="translate(890, 210)">
    <rect width="230" height="100" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#c084fc" opacity="0.2" />
    <text x="28" y="40" fill="#c084fc" font-family="system-ui, sans-serif" font-size="18">⚡</text>
    <text x="64" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Open Source</text>
    <text x="64" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Odoo, ERPNext, MicroReal</text>
    <line x1="16" y1="68" x2="214" y2="68" stroke="#334155" stroke-width="1" />
    <text x="16" y="88" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">★ Star Count Badges</text>
  </g>
</svg>
